name: Refresh config-prod

# Weekly check against the live `ClientRiskProfileConfiguration` Cosmos container. Opens a PR
# when prod has moved; never merges on its own. See scripts/refresh-config-prod.mjs for exactly
# what this reads (and what it deliberately does not: the `ClientRiskProfile` container, which
# holds customer data, is never touched by this job).
#
# Credential note: COSMOS_READONLY_KEY below is a standing secret, not the "temporary Entra
# role, revoked right after the read" pattern this repo otherwise uses (see README.md). Running
# unattended on a schedule requires a credential that can wake up without a human, which is a
# real tradeoff against that pattern — accepted here so the check can run weekly rather than
# whenever someone remembers. Rotate it periodically and scope it to read-only on this one
# container, same as explainer/.env.local documents for local use.

on:
  schedule:
    - cron: '0 6 * * 1' # Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pull current config-prod from live Cosmos
        env:
          COSMOS_ACCOUNT: ${{ secrets.COSMOS_ACCOUNT }}
          COSMOS_DATABASE: ${{ secrets.COSMOS_DATABASE }}
          COSMOS_READONLY_KEY: ${{ secrets.COSMOS_READONLY_KEY }}
        run: node scripts/refresh-config-prod.mjs

      - name: Check whether anything changed
        id: diff
        run: |
          if git diff --quiet -- config-prod; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run explainer checks against the refreshed configs
        if: steps.diff.outputs.changed == 'true'
        id: checks
        continue-on-error: true
        working-directory: explainer
        run: |
          npm ci
          npm run check

      - name: Note check outcome in the summary
        if: steps.diff.outputs.changed == 'true'
        run: |
          {
            echo ""
            echo "## explainer \`npm run check\`"
            echo ""
            if [ "${{ steps.checks.outcome }}" = "success" ]; then
              echo "Passed against the refreshed configs."
            else
              echo "**Failed** against the refreshed configs — see the \`Run explainer checks\` step logs before merging."
            fi
          } >> "$RUNNER_TEMP/config-prod-refresh-summary.md"

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'config-prod: weekly refresh from live Cosmos'
          branch: config-prod/weekly-refresh
          delete-branch: true
          title: 'config-prod: weekly refresh from live Cosmos'
          body-path: ${{ runner.temp }}/config-prod-refresh-summary.md
          labels: config-refresh

      # Scheduled runs are easy to ignore if they're always green. Fail the job (PR is already
      # open by this point) so a broken refresh shows up as a red run, not just a quiet PR.
      - name: Fail the run if checks failed
        if: steps.diff.outputs.changed == 'true' && steps.checks.outcome == 'failure'
        run: exit 1
